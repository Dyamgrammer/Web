<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NIGGA Test</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #111;
      background-image: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)), 
                        url('image_bfdf65.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: #ffffff;
      height: 100vh;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      text-align: center;
    }

    .container {
      background: rgba(25, 25, 25, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 40px 30px;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      z-index: 10;
      width: 90%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 30px;
      letter-spacing: -0.5px;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      width: 100%;
      position: relative;
      min-height: 120px;
    }

    /* Base Modern Button Styles */
    button.action-btn {
      padding: 14px 28px;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 50px;
      cursor: pointer;
      width: 100%;
      max-width: 220px;
      outline: none;
    }

    /* Modern YES Button */
    #yes-btn {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #ffffff;
      box-shadow: 0 8px 20px rgba(16, 185, 129, 0.35);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    #yes-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 26px rgba(16, 185, 129, 0.5);
    }

    #yes-btn:active {
      transform: translateY(0);
    }

    /* Modern NO Button */
    #no-btn {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: #ffffff;
      box-shadow: 0 8px 20px rgba(239, 68, 68, 0.35);
      z-index: 50;
      will-change: left, top;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }
  </style>
</head>
<body>

  <!-- Audio Source -->
  <audio id="bg-music" loop preload="auto">
    <source src="https://www.myinstants.com/media/sounds/we-are-charlie-kirk-song.mp3" type="audio/mpeg">
  </audio>

  <canvas id="fireworksCanvas"></canvas>

  <div class="container" id="quiz-container">
    <h1 id="question">NIGGA ka ba?</h1>
    <div class="btn-group">
      <button id="yes-btn" class="action-btn">YES</button>
      <button id="no-btn" class="action-btn">NO</button>
    </div>
  </div>

  <script>
    const noBtn = document.getElementById('no-btn');
    const yesBtn = document.getElementById('yes-btn');
    const question = document.getElementById('question');
    const btnGroup = document.querySelector('.btn-group');
    const audio = document.getElementById('bg-music');

    // Ultra-Fast Round Bouncing Movement Logic
    let posX = 0;
    let posY = 0;
    let speedX = 28; // Horizontal Speed
    let speedY = 24; // Vertical Speed
    let isMoving = false;

    function initPosition() {
      const rect = noBtn.getBoundingClientRect();
      posX = rect.left;
      posY = rect.top;
      noBtn.style.position = 'fixed';
      noBtn.style.left = `${posX}px`;
      noBtn.style.top = `${posY}px`;
      noBtn.style.margin = '0';
    }

    function animateNoBtn() {
      if (!isMoving) return;

      const btnWidth = noBtn.offsetWidth;
      const btnHeight = noBtn.offsetHeight;
      const maxX = window.innerWidth - btnWidth;
      const maxY = window.innerHeight - btnHeight;

      posX += speedX;
      posY += speedY;

      // Bounce off boundaries of the viewport
      if (posX <= 0 || posX >= maxX) {
        speedX = -speedX;
        posX = Math.max(0, Math.min(posX, maxX));
      }
      if (posY <= 0 || posY >= maxY) {
        speedY = -speedY;
        posY = Math.max(0, Math.min(posY, maxY));
      }

      noBtn.style.left = `${posX}px`;
      noBtn.style.top = `${posY}px`;

      requestAnimationFrame(animateNoBtn);
    }

    function startSuperFastMove(e) {
      if (e) e.preventDefault();
      if (!isMoving) {
        initPosition();
        isMoving = true;
        animateNoBtn();
      }
    }

    // Trigger on hovering over or touching the button
    noBtn.addEventListener('mouseenter', startSuperFastMove);
    noBtn.addEventListener('touchstart', startSuperFastMove);

    // Handle "YES" click
    yesBtn.addEventListener('click', () => {
      isMoving = false; // Stop NO button movement loop
      noBtn.style.display = 'none'; 
      question.innerText = "You're a certified NIGGER!!!";
      btnGroup.style.display = 'none';

      // Play music upon picking YES
      audio.play().catch(err => console.log("Audio play blocked", err));

      startFireworks();
    });

    // Fireworks Canvas Animation
    const canvas = document.getElementById('fireworksCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.radius = Math.random() * 3 + 2;
        this.velocity = {
          x: (Math.random() - 0.5) * 8,
          y: (Math.random() - 0.5) * 8
        };
        this.alpha = 1;
        this.friction = 0.98;
        this.gravity = 0.05;
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.restore();
      }

      update() {
        this.velocity.x *= this.friction;
        this.velocity.y *= this.friction;
        this.velocity.y += this.gravity;
        this.x += this.velocity.x;
        this.y += this.velocity.y;
        this.alpha -= 0.01;
      }
    }

    let particles = [];

    function createFirework(x, y) {
      const particleCount = 60;
      const colors = ['#ff4d4d', '#3399ff', '#ffff4d', '#ff66cc', '#4dff88'];
      
      for (let i = 0; i < particleCount; i++) {
        const color = colors[Math.floor(Math.random() * colors.length)];
        particles.push(new Particle(x, y, color));
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      particles.forEach((particle, index) => {
        if (particle.alpha > 0) {
          particle.update();
          particle.draw();
        } else {
          particles.splice(index, 1);
        }
      });
    }

    function startFireworks() {
      animate();
      setInterval(() => {
        const randomX = Math.random() * canvas.width;
        const randomY = Math.random() * (canvas.height * 0.6);
        createFirework(randomX, randomY);
      }, 300);
    }
  </script>
</body>
</html>
